# /etc/radiusclient/radiusclient.conf — NAS PPPoE (zpot-nas)
# NOTA: el paquete en Alpine es radiusclient (NO radiusclient-ng).
# Este archivo lo usa el plugin radius.so de pppd (pppoe-server-options).
auth_order     radius
authserver     161.97.67.63:1812
acctserver     161.97.67.63:1813
servers        /etc/radiusclient/servers
dictionary     /etc/radiusclient/dictionary
login_radius   /usr/sbin/login.radius
seqfile        /var/run/radius.seq
mapfile        /etc/radiusclient/port-id-map
radius_timeout 3
radius_retries 2
nas_identifier zpot-nas
