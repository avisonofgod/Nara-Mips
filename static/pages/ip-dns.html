<div class="page-header">
  <h3 class="page-title">📡 DNS</h3>
  <button class="btn btn-primary" onclick="mostrarAddDNS()">+ Add DNS</button>
</div>
<div class="table-wrap">
<table>
  <thead><tr>
    <th>SERVER</th>
    <th>TYPE</th>
    <th></th>
  </tr></thead>
  <tbody id="dns-tbody"><tr><td colspan="3" class="page-empty">Cargando...</td></tr></tbody>
</table>
</div>
<script>
function mostrarAddDNS(){
  var html =
    '<div class="form-group"><label class="form-label">Server *</label><input id="dns-addr" class="form-input" type="text" placeholder="8.8.8.8" style="font-family:monospace"/></div>'+
    '<div class="form-group"><label class="form-label">Type</label><select id="dns-type" class="form-input"><option value="upstream">upstream</option><option value="local">local</option><option value="fallback">fallback</option></select></div>';
  zModal.show('add-dns-modal', 'Add DNS Server', html, 'Guardar', function(){
    var addr = document.getElementById('dns-addr').value.trim();
    if(!addr){alert('Server es requerido'); return;}
    var typ = document.getElementById('dns-type').value;
    fetch('/api/dns', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({address:addr, type:typ})})
      .then(function(r){
        if(!r.ok){r.text().then(function(t){alert('Error: '+t);}); return;}
        zModal.close('add-dns-modal');
        loadDNS();
      }).catch(function(e){
        zModal.close('add-dns-modal');
        alert('Error de conexion: '+(e.message||'timeout'));
      });
  }, {size:'lg', cols:2});
}

function loadDNS() {
  fetch('/api/dns')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var tbody = document.getElementById('dns-tbody');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="page-empty">DNS no configurado</td></tr>';
        return;
      }
      var html = '';
      for (var i = 0; i < data.length; i++) {
        var d = data[i];
        html += '<tr>' +
          '<td style="font-family:var(--font-mono);color:var(--accent-cyan)">' + escHtml(d.address || '—') + '</td>' +
          '<td><span class="badge badge-secondary">' + escHtml(d.type || 'upstream') + '</span></td>' +
          '<td><button class="btn-icon-danger" onclick="deleteDNS(\'' + escHtml(d.address) + '\')" title="Eliminar">🗑</button></td>' +
        '</tr>';
      }
      tbody.innerHTML = html;
    })
    ['catch'](function() {
      document.getElementById('dns-tbody').innerHTML = '<tr><td colspan="3" class="page-empty">Error loading DNS</td></tr>';
    });
}

function deleteDNS(addr){
  if(!confirm('Eliminar DNS '+addr+'?')) return;
  fetch('/api/dns', {method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({address:addr})})
    .then(function(r){
      if(!r.ok){r.text().then(function(t){alert('Error: '+t);}); return;}
      loadDNS();
    }).catch(function(e){});
}

window.mostrarAddDNS = mostrarAddDNS;
window.deleteDNS = deleteDNS;
loadDNS();
</script>
