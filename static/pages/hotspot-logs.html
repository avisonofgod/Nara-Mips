<div class="page-header">
  <h3 class="page-title">🔥 Hotspot Logs</h3>
  <button class="btn-secondary" onclick="cargarHotspotLogs()">🔄 Refrescar</button>
</div>

<div id="hslogs-content">
  <div class="loading">Cargando logs del portal/RADIUS...</div>
</div>

<script>
async function cargarHotspotLogs(){
  var c=document.getElementById('hslogs-content');
  c.innerHTML='<div class="loading">Cargando logs del portal/RADIUS...</div>';
  try{
    var r=await fetch('/api/hotspot/logs');
    var data=await r.json();
    if(!data||!data.length){
      c.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">Sin logs</div></div>';
      return;
    }
    var html='<div class="table-wrap"><table><thead><tr><th>Evento (login/accept/reject/accounting/CoA)</th></tr></thead><tbody>';
    for(var i=0;i<data.length;i++){
      html+='<tr><td style="font-family:monospace;font-size:0.8rem;white-space:pre-wrap">'+escHtml(data[i].line||'')+'</td></tr>';
    }
    html+='</tbody></table></div>';
    c.innerHTML=html;
  }catch(e){
    c.innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Connection error</div><div class="empty-desc">'+e.message+'</div></div>';
  }
}
window.cargarHotspotLogs = cargarHotspotLogs;
cargarHotspotLogs();
</script>
