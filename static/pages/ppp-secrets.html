<div class="page-header">
  <h3 class="page-title">Secrets PPP</h3>
  <button class="btn-ghost btn-sm" id="speed-toggle" onclick="toggleSpeedMode()" title="Velocidad en tiempo real: poll 2s de /api/ppp/active (solo esta pagina)">&#9889; Velocidad: OFF</button>
  <span class="text-muted">Usuarios gestionados en FreeRADIUS/daloRADIUS (solo lectura)</span>
</div>

<div id="ppp-secrets-content">
  <div class="loading">Cargando secrets PPP...</div>
</div>

<script>
var dragData = null;
var ordenManual = false;
var pollTimer = null;
// Modo velocidad en tiempo real: persistido por usuario. ON = poll de la
// pagina a 2s (igual que /interfaces/list) + calculo de velocidad con
// delta de bytes del kernel. OFF (default) = poll base de 5s, columnas
// de velocidad "—" y SIN calculo/peticiones de velocidad.
var speedMode = localStorage.getItem('pppSpeed1s') === '1';
// Snapshot de bytes por interfaz (patron interfaces/list): delta entre polls
var prevBytes = {};
var prevTime = Date.now();

function fmtMbps(v){
  if(v === null || v === undefined || isNaN(v)) return '—';
  if(v >= 100) return v.toFixed(0);
  if(v >= 1) return v.toFixed(2);
  return v.toFixed(2);
}

function toggleSpeedMode(){
  speedMode = !speedMode;
  localStorage.setItem('pppSpeed1s', speedMode ? '1' : '0');
  updateSpeedBtn();
  restartPoll();
}

function updateSpeedBtn(){
  var b = document.getElementById('speed-toggle');
  if(b){
    b.textContent = '⚡ Velocidad: ' + (speedMode ? 'ON (2s)' : 'OFF');
    b.style.color = speedMode ? '#16a34a' : '';
  }
}

function pollIntervalMs(){
  return speedMode ? 2000 : 5000;
}

function restartPoll(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  pollTimer = setInterval(loadPppSecrets, pollIntervalMs());
}

function loadPppSecrets(){
  var container = document.getElementById('ppp-secrets-content');
  if(!container) return;
  // fetch DIRECTO (sin apiFetch cache 3s — con poll 2s el cache devolveria
  // el mismo dato → delta 0 → velocidad 0.00).
  Promise.all([
    fetch('/api/ppp/secrets?_='+Date.now()).then(function(r){return r.json();}).catch(function(){return [];}),
    fetch('/api/ppp/active?_='+Date.now()).then(function(r){return r.json();}).catch(function(){return [];})
  ]).then(function(res){
    var list = res[0];
    var active = res[1];
    if(!list || list.length===0){
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#x1f512;</div><div class="empty-title">Sin secrets PPP</div></div>';
      return;
    }
    // Orden por ID (1..n) SOLO la primera vez / si no hay orden manual
    if(!ordenManual) list.sort(function(a,b){ return (a.id||0)-(b.id||0); });
    var connected = {};
    var nowBytes = {};
    if(active && active.length) for(var i=0;i<active.length;i++){
      var a = active[i];
      connected[a.user] = { on: true, iface: a.interface, bi: a.bytes_in||0, bo: a.bytes_out||0 };
      nowBytes[a.interface] = { bi: a.bytes_in||0, bo: a.bytes_out||0 };
    }
    for(var i=0;i<list.length;i++){
      if(!list[i].enabled && connected[list[i].username]){
        disconnectPpp(list[i].username, true);
        delete connected[list[i].username];
      }
    }
    var now = Date.now();
    var dt = (now - prevTime) / 1000;
    if(dt < 0.2) dt = 0.2;
    var h = '';
    for(var i=0;i<list.length;i++){
      var x = list[i];
      var st = connected[x.username];
      var conectado = st ? '<span class="badge badge-success">Conectado</span>' : '<span class="badge badge-secondary">Desconectado</span>';
      // Velocidad Rx/Tx: delta de bytes del kernel entre polls (2s con ON).
      // OJO semantica: para pppN, bytes_in = SUBIDA del cliente (rx kernel),
      // bytes_out = DESCARGA del cliente (tx kernel). Rx↓ = descarga, Tx↑ = subida.
      var rxTd = '<span class="text-muted">&#x2014;</span>';
      var txTd = '<span class="text-muted">&#x2014;</span>';
      if(st && speedMode){
        var pv = prevBytes[st.iface];
        if(pv){
          var downMbps = Math.max(0, st.bo - pv.bo) * 8 / dt / 1e6;
          var upMbps   = Math.max(0, st.bi - pv.bi) * 8 / dt / 1e6;
          rxTd = '<span class="mono" style="color:#16a34a">&#8595; '+fmtMbps(downMbps)+'</span>';
          txTd = '<span class="mono" style="color:#2563eb">&#8593; '+fmtMbps(upMbps)+'</span>';
        }
      }
      h += '<tr id="row-'+i+'" data-user="'+escAttr(x.username)+'" ondragover="dragOver(event,'+i+')" ondrop="dragDrop(event)" ondragend="dragEnd(event)">'+
        '<td><span draggable="true" ondragstart="dragStart(event,'+i+')" style="cursor:grab;color:#a8a29e;user-select:none" title="Arrastrar para reordenar">&#x22ef;</span></td>'+
        '<td><span class="mono">'+(x.id ? escHtml(String(x.id)) : '<span class="text-muted">&#x2014;</span>')+'</span></td>'+
        '<td><span style="font-weight:600">'+escHtml(x.username)+'</span></td>'+
        '<td><span class="mono">'+(x.ip && x.ip !== '*' ? escHtml(x.ip) : '<span class="text-muted">&#x2014;</span>')+'</span></td>'+
        '<td>'+conectado+'</td>'+
        '<td>'+rxTd+'</td>'+
        '<td>'+txTd+'</td>'+
        '<td><button class="btn-ghost btn-sm" onclick="disconnectPpp(\''+escAttr(x.username)+'\')">Desconectar</button> '+
            '<button class="btn-ghost btn-sm" style="color:var(--clr-danger,#e74c3c)" onclick="deleteSecret(\''+escAttr(x.username)+'\')">Eliminar</button></td>'+
      '</tr>';
    }
    container.innerHTML = '<div class="table-wrap"><table><thead><tr>'+
      '<th></th><th>ID</th><th>Username</th><th>IP</th><th>Sesión</th><th>Rx &#8595; Mbps</th><th>Tx &#8593; Mbps</th><th></th>'+
    '</tr></thead><tbody>'+h+'</tbody></table></div>';
    // Snapshot para la proxima iteracion (patron interfaces/list)
    prevBytes = nowBytes;
    prevTime = now;
  }).catch(function(e){
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#x26a0;&#xfe0f;</div><div class="empty-title">Error</div><div class="empty-desc">'+e.message+'</div></div>';
  });
}

window._initPppSecrets = loadPppSecrets;

// ───── Drag & Drop para reordenar filas (estilo /firewall/nftables) ─────
function dragStart(ev, idx){
  dragData = { fromIdx: idx };
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', idx+'');
  ev.target.style.opacity = '0.4';
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } // no recargar durante el arrastre
}

function dragOver(ev, idx){
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  if(!dragData || dragData.fromIdx === idx) return;
  document.querySelectorAll('[id^="row-"]').forEach(function(r){
    r.style.transform = '';
    r.style.borderTop = '';
    r.style.borderBottom = '';
  });
  var overRow = document.getElementById('row-'+idx);
  if(overRow){
    if(idx > dragData.fromIdx) overRow.style.borderTop = '2px solid #ea580c';
    else overRow.style.borderBottom = '2px solid #ea580c';
  }
}

function dragDrop(ev){
  ev.preventDefault();
  if(!dragData) return;
  var dropTarget = ev.target.closest('[id^="row-"]');
  if(!dropTarget){ dragEnd(ev); return; }
  var newIdx = parseInt(dropTarget.id.replace('row-',''));
  if(newIdx === dragData.fromIdx){ dragEnd(ev); return; }

  var users = Array.from(document.querySelectorAll('#ppp-secrets-content tbody tr'))
    .map(function(r){ return r.getAttribute('data-user'); });
  var moved = users.splice(dragData.fromIdx, 1)[0];
  users.splice(newIdx, 0, moved);

  fetch('/api/ppp/secrets/order', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({order: users})
  })
  .then(function(r){ return r.json(); })
  .then(function(resp){
    if(resp.ok){
      ordenManual = true;
      loadPppSecrets();
    } else {
      alert('Error: '+(resp.error||'desconocido'));
    }
  })
  .catch(function(e){ alert('Error: '+e.message); });
  dragEnd(ev);
}

function dragEnd(ev){
  if(ev && ev.target){
    var row = ev.target.closest('tr');
    if(row) row.style.opacity = '';
  }
  document.querySelectorAll('[id^="row-"]').forEach(function(r){
    r.style.transform = '';
    r.style.borderTop = '';
    r.style.borderBottom = '';
    r.style.transition = '';
  });
  dragData = null;
  if(!pollTimer) restartPoll(); // reanudar polling
}

function disconnectPpp(username, noReload){
  fetch('/api/ppp/secrets/disconnect', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username: username})
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d.ok){
      if(!noReload) loadPppSecrets();
    } else {
      alert('Error: '+(d.error||JSON.stringify(d)));
    }
  }).catch(function(e){ alert('Error: '+e.message); });
}

function deleteSecret(username){
  if(!confirm('Eliminar secreto '+username+'? El ID quedara libre para un cliente nuevo.')) return;
  fetch('/api/ppp/secrets/delete', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username: username})
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d.ok) loadPppSecrets();
    else alert('Error: '+(d.error||JSON.stringify(d)));
  }).catch(function(e){ alert('Error: '+e.message); });
}

window.disconnectPpp = disconnectPpp;
window.deleteSecret = deleteSecret;
window.toggleSpeedMode = toggleSpeedMode;
window.loadPppSecrets = loadPppSecrets;
updateSpeedBtn();
loadPppSecrets();
pollTimer = setInterval(loadPppSecrets, pollIntervalMs());
</script>
