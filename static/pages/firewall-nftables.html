<div class="page-header">
  <h3 class="page-title">🛡️ nftables Dashboard</h3>
  <div style="display:flex;gap:0.5rem">
    <button class="btn-primary" onclick="cargarNftDash()">⟳ Refrescar</button>
    <button class="btn-success" onclick="abrirModalNftRule()">➕ Regla</button>
  </div>
</div>

<style>
.nft-pill{display:inline-block;padding:0.25rem 0.6rem;margin:0.15rem;border-radius:999px;font-size:0.78rem;cursor:pointer;background:#fef3c7;border:1px solid #fde68a;transition:all 0.12s}
.nft-pill:hover{background:#fed7aa !important;border-color:#f97316 !important;color:inherit !important}
.nft-pill.selected{background:#ea580c !important;border-color:#ea580c !important;color:#fff !important}
.nft-pill.selected:hover{background:#c2410c !important;border-color:#c2410c !important;color:#fff !important}
</style>

<div style="display:flex;flex-direction:column;gap:1rem">

  <!-- TOP: Tables + Sets horizontal -->
  <div class="card" style="padding:0.75rem;display:flex;gap:2rem;flex-wrap:wrap">
    <div>
      <div style="font-size:0.8rem;font-weight:600;color:var(--clr-text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.5rem">📦 Tablas</div>
      <div id="nft-tree" style="font-size:0.82rem">Cargando...</div>
    </div>
    <div>
      <div style="font-size:0.8rem;font-weight:600;color:var(--clr-text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.5rem">📋 Sets</div>
      <div id="nft-sets-list" style="font-size:0.82rem">Cargando...</div>
    </div>
  </div>

  <!-- BOTTOM: Rules -->
  <div class="card" style="padding:0">
    <div id="nft-rules-header" style="padding:0.75rem 1rem;border-bottom:1px solid var(--clr-border-strong);font-weight:600;font-size:0.9rem">
      🔍 Selecciona una tabla > chain para ver sus reglas
    </div>
    <div class="table-wrap" style="border:none">
      <table>
        <thead><tr><th>#</th><th>TABLE</th><th>CHAIN</th><th>HANDLE</th><th>REGLA</th><th></th></tr></thead>
        <tbody id="nft-rules-body"><tr><td colspan="6" class="page-empty">Selecciona una chain</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
var nftTables = {};

function cargarNftDash(){
  Promise.all([
    fetch('/api/firewall/filter').then(function(r){ return r.json(); }),
    fetch('/api/firewall/nat').then(function(r){ return r.json(); }),
    fetch('/api/firewall/mangle').then(function(r){ return r.json(); }),
    fetch('/api/firewall/sets').then(function(r){ return r.json(); })
  ]).then(function(responses){
    nftTables = {};
    // Agrupar reglas por tabla
    [responses[0], responses[1], responses[2]].forEach(function(data){
      var rules = data.rules || [];
      rules.forEach(function(r){
        var chain = r.chain || '';
        var table = 'hotspot';
        if(chain.indexOf('mwan/') === 0){ table = 'mwan'; chain = chain.replace('mwan/',''); }
        else if(chain.indexOf('hotspot/') === 0){ table = 'hotspot'; chain = chain.replace('hotspot/',''); }
        else if(chain.indexOf('filter/') === 0){ table = 'filter'; chain = chain.replace('filter/',''); }
        if(!nftTables[table]) nftTables[table] = {};
        if(!nftTables[table][chain]) nftTables[table][chain] = [];
        nftTables[table][chain].push(r);
      });
    });
    renderNftTree();
    renderNftSets(responses[3].sets || []);
  }).catch(function(e){
    document.getElementById('nft-tree').innerHTML = '<span style="color:var(--accent-red)">Error: '+e.message+'</span>';
  });
}

function renderNftTree(){
  var html = '';
  var tables = Object.keys(nftTables).sort();
  tables.forEach(function(t, ti){
    var chains = Object.keys(nftTables[t]).sort();
    var chainHtml = '';
    chains.forEach(function(c, ci){
      var count = nftTables[t][c].length;
      chainHtml += '<span class="nft-pill" '+
        'onclick="seleccionarChain(\''+t+'\',\''+c+'\')" '+
        'id="chain-'+t+'-'+c+'">'+
        escHtml(c)+' <span style="color:#78716c;font-size:0.7rem">('+count+')</span></span>';
    });
    html += '<div style="margin-bottom:0.3rem">'+
      '<span style="font-weight:600;color:#d97706;margin-right:0.5rem;font-size:0.85rem">'+escHtml(t)+'</span>'+
      chainHtml+'</div>';
  });
  document.getElementById('nft-tree').innerHTML = html || '<span class="text-muted">Sin tablas</span>';
}

function renderNftSets(sets){
  var html = '';
  sets.forEach(function(s){
    var elems = '';
    if(s.elements){
      if(Array.isArray(s.elements)) elems = s.elements.length+' elems';
      else elems = JSON.stringify(s.elements).slice(0,50);
    }
    html += '<div style="padding:0.2rem 0;border-bottom:1px solid var(--clr-border-weak)">'+
      '<span style="font-weight:500">'+escHtml(s.name)+'</span>'+
      ' <span style="color:var(--clr-text-muted);font-size:0.72rem">'+escHtml(s.type||'')+'</span>'+
      (elems ? ' <span style="color:#64748b;font-size:0.7rem">('+elems+')</span>' : '')+
      '</div>';
  });
  document.getElementById('nft-sets-list').innerHTML = html || '<span class="text-muted">Sin sets</span>';
}

function seleccionarChain(table, chain){
  document.querySelectorAll('.nft-pill').forEach(function(el){
    el.classList.remove('selected');
  });
  var sel = document.getElementById('chain-'+table+'-'+chain);
  if(sel) sel.classList.add('selected');

  var rules = (nftTables[table] && nftTables[table][chain]) || [];
  document.getElementById('nft-rules-header').textContent = '📌 '+table+' > '+chain+' ('+rules.length+' reglas)';

  var tbody = document.getElementById('nft-rules-body');
  if(!rules.length){
    tbody.innerHTML = '<tr><td colspan="6" class="page-empty">Sin reglas en '+table+' > '+chain+'</td></tr>';
    return;
  }
  var h = '';
  rules.forEach(function(r, i){
    h += '<tr '+
      'ondragover="dragOver(event,'+i+')" '+
      'ondrop="dragDrop(event,\''+table+'\',\''+r.chain+'\')" '+
      'id="row-'+i+'">'+
      '<td style="white-space:nowrap">'+(i+1)+
      ' <span draggable="true" style="cursor:grab;color:#a8a29e;font-size:0.8rem;user-select:none" '+
      'ondragstart="dragStart(event,\''+table+'\',\''+r.chain+'\','+r.handle+','+i+')" '+
      'ondragend="dragEnd(event)" title="Arrastrar para reordenar">☰</span>'+
      '</td>'+
      '<td><span class="badge" style="background:var(--accent-blue)">'+escHtml(table)+'</span></td>'+
      '<td><span class="badge">'+escHtml(r.chain)+'</span></td>'+
      '<td style="font-family:monospace;font-size:0.78rem;color:#64748b">'+r.handle+'</td>'+
      '<td style="font-family:monospace;font-size:0.78rem;word-break:break-all">'+escHtml(r.expr_text||'')+'</td>'+
      '<td><button class="btn-ghost btn-sm" onclick="eliminarNftRule(\''+table+'\',\''+r.chain+'\','+r.handle+')" title="Eliminar" style="color:var(--accent-red)">✕</button></td>'+
      '</tr>';
  });
  tbody.innerHTML = h;
}

function abrirModalNftRule(){
  // Construir opciones de tabla > chain
  var opts = '';
  var tables = Object.keys(nftTables).sort();
  tables.forEach(function(t){
    var chains = Object.keys(nftTables[t]).sort();
    chains.forEach(function(c){
      opts += '<option value="'+t+'/'+c+'">'+t+' > '+c+'</option>';
    });
  });
  if(!opts) opts = '<option value="">(sin chains disponibles)</option>';

  var html = '<label class="form-label">Destino</label>'+
    '<select id="nft-rule-chain" class="form-input">'+opts+'</select>'+
    '<label class="form-label">Posición</label>'+
    '<select id="nft-rule-pos" class="form-input">'+
      '<option value="add">Al final de la chain</option>'+
      '<option value="insert">Al inicio de la chain</option>'+
    '</select>'+
    '<label class="form-label">Regla nftables</label>'+
    '<input type="text" id="nft-rule-expr" class="form-input" placeholder="iif eth3 tcp dport 443 accept" style="font-family:monospace">'+
    '<small class="form-hint">Ej: iifname &quot;ppp*&quot; ip daddr 1.2.3.4 drop</small>';

  zModal.show('nftRuleModal','➕ Nueva Regla nftables',html,'💾 Agregar',guardarNftRule,{size:'lg',cols:1});
}

function guardarNftRule(){
  var dest = document.getElementById('nft-rule-chain').value;
  var expr = document.getElementById('nft-rule-expr').value.trim();
  if(!dest || !expr){ alert('Seleccione destino e ingrese la regla'); return; }

  var parts = dest.split('/');
  var table = parts[0], chain = parts[1];
  var pos = document.getElementById('nft-rule-pos')?.value || 'add';
  fetch('/api/firewall/rule', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({table: table, chain: chain, rule: expr, position: pos})
  })
  .then(function(r){ return r.json(); })
  .then(function(resp){
    if(resp.success){
      zModal.close('nftRuleModal');
      cargarNftDash();
    } else {
      alert('Error: '+(resp.error||'desconocido'));
    }
  })
  .catch(function(e){ alert('Error: '+e.message); });
}

function eliminarNftRule(table, chain, handle){
  if(!confirm('Eliminar regla handle '+handle+' en '+table+' > '+chain+'?')) return;

  // Determinar endpoint
  var url = '/api/firewall/filter/delete';
  if(table === 'mwan') url = '/api/firewall/filter/delete'; // mwan usa mismo endpoint

  fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({chain: (table==='hotspot'?'hotspot/':'')+chain, handle: handle})
  })
  .then(function(r){ return r.json(); })
  .then(function(resp){
    if(resp.success) cargarNftDash();
    else alert('Error: '+(resp.error||'desconocido'));
  })
  .catch(function(e){ alert('Error: '+e.message); });
}

function moverRegla(table, chain, handle, dir){
  fetch('/api/firewall/rule/move', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({table: table, chain: chain, handle: handle, direction: dir})
  })
  .then(function(r){ return r.json(); })
  .then(function(resp){
    if(resp.success) cargarNftDash();
    else alert('Error: '+(resp.error||'desconocido'));
  })
  .catch(function(e){ alert('Error: '+e.message); });
}

// ───── Drag & Drop para reordenar reglas ─────
var dragData = null;

function dragStart(ev, table, chain, handle, idx){
  dragData = {table: table, chain: chain, handle: handle, fromIdx: idx};
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', handle+'');
  ev.target.style.opacity = '0.4';
  // Marcar filas vecinas con efecto visual
  document.querySelectorAll('[id^="row-"]').forEach(function(r){
    r.style.transition = 'transform 0.15s ease';
  });
}

function dragOver(ev, idx){
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  if(!dragData || dragData.fromIdx === idx) return;
  // Efecto visual: las filas se desplazan
  document.querySelectorAll('[id^="row-"]').forEach(function(r){
    var ri = parseInt(r.id.replace('row-',''));
    r.style.transform = '';
    r.style.borderTop = '';
    r.style.borderBottom = '';
  });
  var overRow = document.getElementById('row-'+idx);
  if(overRow){
    if(idx > dragData.fromIdx) overRow.style.borderTop = '2px solid #ea580c';
    else overRow.style.borderBottom = '2px solid #ea580c';
  }
}

function dragDrop(ev, table, chain){
  ev.preventDefault();
  if(!dragData) return;
  var dropTarget = ev.target.closest('[id^="row-"]');
  if(!dropTarget) { dragEnd(ev); return; }
  var newIdx = parseInt(dropTarget.id.replace('row-',''));
  if(newIdx === dragData.fromIdx) { dragEnd(ev); return; }

  fetch('/api/firewall/rule/move-to', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      table: dragData.table,
      chain: dragData.chain,
      handle: dragData.handle,
      target_index: newIdx
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(resp){
    if(resp.success) cargarNftDash();
    else alert('Error: '+(resp.error||'desconocido'));
  })
  .catch(function(e){ alert('Error: '+e.message); });
  dragEnd(ev);
}

function dragEnd(ev){
  if(ev && ev.target){
    var row = ev.target.closest('tr');
    if(row) row.style.opacity = '';
  }
  document.querySelectorAll('[id^="row-"]').forEach(function(r){
    r.style.transform = '';
    r.style.borderTop = '';
    r.style.borderBottom = '';
    r.style.transition = '';
  });
  dragData = null;
}

window.cargarNftDash = cargarNftDash;
cargarNftDash();
</script>
